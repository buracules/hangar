name: Hangar
options:
  bundleIdPrefix: com.burakustun
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    # Ad-hoc signing for local builds; Hangar is not sandboxed (Docker socket, Apple Events).
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
targets:
  Hangar:
    type: application
    platform: macOS
    sources: [Sources]
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Hangar
        CFBundleName: Hangar
        LSUIElement: true
        NSAppleEventsUsageDescription: Hangar starts, stops and suspends your UTM virtual machines.
    settings:
      base:
        PRODUCT_NAME: Hangar
        PRODUCT_BUNDLE_IDENTIFIER: com.burakustun.hangar
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        ENABLE_APP_SANDBOX: NO
    scheme:
      testTargets: [HangarTests]
  HangarTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests]
    dependencies:
      - target: Hangar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.burakustun.hangar.tests
        GENERATE_INFOPLIST_FILE: YES
